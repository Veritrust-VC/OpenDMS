server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, re-resolved every 10s.
    #
    # Without this nginx resolves "api" ONCE at startup and keeps proxying to
    # that IP forever, so any api rebuild leaves the edge 502-ing while the
    # api answers 200 on localhost. $request_uri is not optional: with a
    # variable in proxy_pass nginx passes the normalised URI and silently drops
    # the query string.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8002;

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /uapf/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }
    location /docs {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass $api_upstream$request_uri;
    }
    location / { try_files $uri $uri/ /index.html; }
}
