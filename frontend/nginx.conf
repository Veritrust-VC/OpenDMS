server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, re-resolved every 10s.
    #
    # Without this nginx resolves "api" ONCE at startup and keeps proxying to
    # that IP forever, so any api rebuild leaves the edge 502-ing while the
    # api answers 200 on localhost. $request_uri is not optional: with a
    # variable in proxy_pass nginx passes the normalised URI and silently drops
    # the query string.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8002;

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Metadata generation runs the whole semantic process (model steps).
        proxy_read_timeout 300s;
    }
    # Only the UAPF host surface is the API; /uapf/<tab> pages are the web app,
    # so a browser refresh on /uapf/packages must not land on the backend.
    location /uapf/host/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }
    # Agent-to-agent surface. Buffering off so a future streaming transport
    # is not silently held back by nginx.
    location /mcp {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /docs {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass $api_upstream$request_uri;
    }
    # The organisation's DID document (did:web:{this host}), published by the
    # VeriDocs SDK sidecar, which holds the key. Public key only. Anything
    # else under /.well-known/ is a clean 404, never the SPA's index.html:
    # a did:web resolver that gets HTTP 200 with HTML fails silently.
    location = /.well-known/did.json {
        set $sdk_upstream http://sdk:3100;
        proxy_pass $sdk_upstream/.well-known/did.json;
        proxy_set_header Host $host;
        limit_except GET HEAD { deny all; }
    }
    location /.well-known/ { return 404; }
    # The app shell must never be cached, or a browser keeps an old bundle after
    # a deploy; the hashed files under /assets/ can be cached for good.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
